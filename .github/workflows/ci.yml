name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  web:
    name: Painel web (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinyml_ambiente/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tinyml_ambiente/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
